<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self'; 
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' https://shared.akamai.steamstatic.com;
      " />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="
      default-src 'self'; 
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com
      " />
    <title>GitCloud</title>
    <link
      rel="stylesheet"
      href="style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap");
    </style>
  </head>
  <body>
    <div class="app">
      <nav>
        <button type="button">Library</button>
        <button type="button">Logs</button>
        <button type="button">Settings</button>
      </nav>
      <main>
        <section
          id="library"
          class="active">
          <div class="section-header">
            <button id="library-reload-btn"></button>
          </div>
          <div
            id="library-body"
            class="section-body"></div>
        </section>
        <section id="logs"></section>
        <section id="settings">
          <form>
            <div class="dir-picker">
              <input
                type="text"
                name="settingsSteamPath"
                readonly
                id="settingsSteamPath"
                placeholder="path of your Steam folder" />
              <button id="steam-dir-picker">Browse</button>
            </div>
            <div class="dir-picker">
              <input
                type="text"
                name="settingsUrl"
                readonly
                id="settingsUrl"
                placeholder="url of your repository" />
              <button id="repo-paste-btn">Paste</button>
            </div>
            <div class="dir-picker">
              <input
                type="text"
                name="settingsTargetDir"
                readonly
                id="settingsTargetDir"
                placeholder="path of local repository" />
              <button id="dir-picker-btn">Browse</button>
            </div>
            <div class="buttons-wrapper">
              <button
                type="submit"
                id="settingsSaveBtn">
                Save
              </button>
              <button
                class="red"
                type="reset"
                id="settingsResetBtn">
                Reset
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
  <script src="renderer.js"></script>
</html>
