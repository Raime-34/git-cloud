<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self'; 
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com
      " />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="
      default-src 'self'; 
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com
      " />
    <title>GitCloud</title>
    <link
      rel="stylesheet"
      href="style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap");
    </style>
  </head>
  <body>
    <div class="app">
      <nav>
        <button type="button">Library</button>
        <button type="button">Logs</button>
        <button type="button">Repository</button>
        <button type="button">Settings</button>
      </nav>
      <main>
        <section
          id="library"
          class="active">
          <p id="info"></p>
        </section>
        <section id="settings">
          <form>
            <input
              type="text"
              name="settingsUrl"
              id="settingsUrl"
              placeholder="url of your repository" />
            <div class="buttons-wrapper">
              <button
                type="submit"
                id="settingsSaveBtn">
                Save
              </button>
              <button
                class="red"
                type="reset"
                id="settingsResetBtn">
                Reset
              </button>
              <button id="clone">clone</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
  <script src="renderer.js"></script>
</html>
